services:
  app-db:
    image: postgres:16
    container_name: lifecycle-db
    environment:
      POSTGRES_DB: ${APP_DB_NAME:?APP_DB_NAME must be set}
      POSTGRES_USER: ${APP_DB_USER:?APP_DB_USER must be set}
      # Existing postgres-data volumes keep their original role password;
      # APP_DB_PASSWORD must match it. To rotate, run
      # ALTER ROLE <user> WITH PASSWORD '<new-password>' as a database admin,
      # then update APP_DB_PASSWORD in both .env files and restart the stack.
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: lifecycle-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      APP_DB_HOST: ${APP_DB_HOST:?APP_DB_HOST must be set}
      APP_DB_PORT: ${APP_DB_PORT:?APP_DB_PORT must be set}
      APP_DB_NAME: ${APP_DB_NAME:?APP_DB_NAME must be set}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER must be set}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}
    networks:
      - default
    depends_on:
      app-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
