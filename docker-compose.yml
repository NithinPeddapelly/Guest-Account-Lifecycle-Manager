services:
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    ports:
      - "8080:80"
    volumes:
      - nextcloud-data:/var/www/html
    restart: unless-stopped

  app-db:
    image: postgres:16
    container_name: lifecycle-db
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-guest_lifecycle}
      POSTGRES_USER: ${APP_DB_USER:-lifecycle_admin}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-lifecycle_admin} -d ${APP_DB_NAME:-guest_lifecycle}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: lifecycle-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    depends_on:
      app-db:
        condition: service_healthy
      nextcloud:
        condition: service_started
    restart: unless-stopped

volumes:
  nextcloud-data:
  postgres-data:
